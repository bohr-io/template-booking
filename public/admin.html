<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title data-i18n="admin.brand">Agendamentos</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/admin.js"></script>
  </head>
  <body>
    <main id="setup" class="login" hidden>
      <div class="card stack">
        <h1 data-i18n="admin.setupTitle"></h1>
        <p data-i18n="admin.setupText"></p>
        <ul class="setup-steps">
          <li data-i18n="admin.setupBohr"></li>
          <li data-i18n="admin.setupWrangler"></li>
          <li data-i18n="admin.setupLocal"></li>
        </ul>
      </div>
    </main>

    <main id="login" class="login" hidden>
      <form id="login-form" class="card stack">
        <h1 data-i18n="admin.loginTitle"></h1>
        <p class="muted" data-i18n="admin.loginText"></p>
        <input type="text" name="username" value="admin" autocomplete="username" hidden />
        <label class="field">
          <span data-i18n="admin.password"></span>
          <input type="password" name="password" autocomplete="current-password" required maxlength="256" />
        </label>
        <p id="login-error" class="alert error" role="alert" hidden></p>
        <button class="btn primary block" type="submit" data-i18n="admin.login"></button>
      </form>
    </main>

    <div id="admin" hidden>
      <header class="admin-header">
        <div class="container">
          <span class="brand" data-i18n="admin.brand"></span>
          <nav class="tabs" role="tablist">
            <button type="button" role="tab" id="tab-agenda" aria-controls="panel-agenda" aria-selected="true" data-i18n="tab.agenda"></button>
            <button type="button" role="tab" id="tab-services" aria-controls="panel-services" aria-selected="false" data-i18n="tab.services"></button>
            <button type="button" role="tab" id="tab-hours" aria-controls="panel-hours" aria-selected="false" data-i18n="tab.hours"></button>
            <button type="button" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="false" data-i18n="tab.settings"></button>
          </nav>
          <a class="btn ghost small" href="/" target="_blank" rel="noopener" data-i18n="admin.viewSite"></a>
          <button id="logout" class="btn small" type="button" data-i18n="admin.logout"></button>
        </div>
      </header>

      <main class="container admin-main">
        <div class="stats">
          <div class="stat"><span class="muted small" data-i18n="stats.today"></span><strong id="stat-today">–</strong></div>
          <div class="stat"><span class="muted small" data-i18n="stats.week"></span><strong id="stat-week">–</strong></div>
          <div class="stat"><span class="muted small" data-i18n="stats.pending"></span><strong id="stat-pending">–</strong></div>
        </div>

        <section id="panel-agenda" role="tabpanel" aria-labelledby="tab-agenda" class="stack panel">
          <div class="toolbar">
            <label class="field inline">
              <span data-i18n="agenda.status"></span>
              <select id="status-filter">
                <option value="all" data-i18n="status.all"></option>
                <option value="pending" data-i18n="status.pending"></option>
                <option value="confirmed" data-i18n="status.confirmed"></option>
                <option value="cancelled" data-i18n="status.cancelled"></option>
              </select>
            </label>
            <label class="check"><input id="show-past" type="checkbox" /> <span data-i18n="agenda.showPast"></span></label>
            <a class="btn small push" href="/api/admin/bookings.csv" download data-i18n="agenda.export"></a>
          </div>
          <div id="agenda" class="agenda"></div>
          <p id="agenda-empty" class="empty" hidden data-i18n="agenda.empty"></p>
        </section>

        <section id="panel-services" role="tabpanel" aria-labelledby="tab-services" class="stack panel" hidden>
          <div class="toolbar">
            <p class="muted small grow" data-i18n="services.hint"></p>
            <button id="new-service" class="btn primary" type="button" data-i18n="services.new"></button>
          </div>
          <ul id="service-list" class="admin-list"></ul>
          <p id="services-empty" class="empty" hidden data-i18n="services.empty"></p>
        </section>

        <section id="panel-hours" role="tabpanel" aria-labelledby="tab-hours" class="stack panel" hidden>
          <form id="hours-form" class="card stack">
            <div>
              <h2 data-i18n="hours.title"></h2>
              <p class="muted small" data-i18n="hours.hint"></p>
            </div>
            <div id="week" class="week"></div>
            <div><button class="btn primary" type="submit" data-i18n="common.save"></button></div>
          </form>

          <section class="card stack" aria-labelledby="days-off-title">
            <div>
              <h2 id="days-off-title" data-i18n="daysOff.title"></h2>
              <p class="muted small" data-i18n="daysOff.hint"></p>
            </div>
            <form id="day-off-form" class="toolbar align-end">
              <label class="field">
                <span data-i18n="daysOff.date"></span>
                <input name="date" type="date" required />
              </label>
              <label class="field grow">
                <span><span data-i18n="daysOff.note"></span> <span class="muted small">(<span data-i18n="form.optional"></span>)</span></span>
                <input name="note" maxlength="100" data-i18n-placeholder="daysOff.notePlaceholder" />
              </label>
              <button class="btn" type="submit" data-i18n="daysOff.add"></button>
            </form>
            <ul id="days-off" class="admin-list compact"></ul>
            <p id="days-off-empty" class="muted small" hidden data-i18n="daysOff.empty"></p>
          </section>
        </section>

        <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
          <form id="settings" class="card stack narrow">
            <p class="muted small" data-i18n="settings.hint"></p>
            <label class="field">
              <span data-i18n="settings.businessName"></span>
              <input name="business_name" maxlength="80" />
            </label>
            <label class="field">
              <span data-i18n="settings.description"></span>
              <textarea name="description" maxlength="600" rows="3"></textarea>
            </label>
            <div class="form-grid">
              <label class="field">
                <span data-i18n="settings.timezone"></span>
                <input name="timezone" list="timezones" required maxlength="64" autocomplete="off" spellcheck="false" />
                <datalist id="timezones"></datalist>
              </label>
              <label class="field">
                <span data-i18n="settings.currency"></span>
                <input name="currency" list="currencies" required minlength="3" maxlength="3" autocomplete="off" spellcheck="false" />
                <datalist id="currencies">
                  <option value="BRL"></option>
                  <option value="USD"></option>
                  <option value="EUR"></option>
                  <option value="GBP"></option>
                  <option value="ARS"></option>
                  <option value="CLP"></option>
                  <option value="COP"></option>
                  <option value="MXN"></option>
                  <option value="PEN"></option>
                  <option value="UYU"></option>
                </datalist>
              </label>
            </div>
            <div class="form-grid three">
              <label class="field">
                <span data-i18n="settings.slotStep"></span>
                <select name="slot_step">
                  <option value="15">15 min</option>
                  <option value="30">30 min</option>
                  <option value="60">60 min</option>
                </select>
              </label>
              <label class="field">
                <span data-i18n="settings.minNotice"></span>
                <input name="min_notice_hours" type="number" min="0" max="720" step="1" required />
              </label>
              <label class="field">
                <span data-i18n="settings.daysAhead"></span>
                <input name="days_ahead" type="number" min="1" max="365" step="1" required />
              </label>
            </div>
            <label class="check"><input type="checkbox" name="auto_confirm" /> <span data-i18n="settings.autoConfirm"></span></label>
            <p class="muted small" data-i18n="settings.autoConfirmHint"></p>
            <div><button class="btn primary" type="submit" data-i18n="common.save"></button></div>
          </form>
        </section>
      </main>
    </div>

    <dialog id="service-dialog" aria-labelledby="service-dialog-title">
      <form id="service-form" class="stack" method="dialog">
        <h2 id="service-dialog-title"></h2>
        <label class="field">
          <span data-i18n="services.name"></span>
          <input name="name" required maxlength="80" />
        </label>
        <label class="field">
          <span><span data-i18n="services.description"></span> <span class="muted small">(<span data-i18n="form.optional"></span>)</span></span>
          <textarea name="description" maxlength="500" rows="3"></textarea>
        </label>
        <div class="form-grid">
          <label class="field">
            <span data-i18n="services.duration"></span>
            <input name="duration" type="number" min="5" max="480" step="5" required />
          </label>
          <label class="field">
            <span data-i18n="services.price"></span>
            <input name="price" type="number" min="0" max="1000000" step="0.01" required inputmode="decimal" />
            <span class="hint" data-i18n="services.priceHint"></span>
          </label>
        </div>
        <label class="check"><input type="checkbox" name="active" /> <span data-i18n="services.active"></span></label>
        <p id="service-error" class="alert error" role="alert" hidden></p>
        <div class="row dialog-actions">
          <button id="service-cancel" class="btn" type="button" data-i18n="services.cancel"></button>
          <button class="btn primary" type="submit" data-i18n="common.save"></button>
        </div>
      </form>
    </dialog>
  </body>
</html>
